<mat-toolbar color="primary" class="navbar">
  <button mat-button [matMenuTriggerFor]="menu" class="user-btn">
    <img [src]="imageSource" alt="User Image" class="avatar">
    <span class="user-name">{{ userName }}</span>
    <mat-icon class="chev">expand_more</mat-icon>
  </button>

  <div class="search">
    <mat-icon class="search-ic">search</mat-icon>
    <input type="search" #searchInput placeholder="Search homes..." class="search-input"
      (keyup.enter)="search(searchInput.value)">

    <button mat-icon-button (click)="search(searchInput.value)" class="search-btn">
      <mat-icon>search</mat-icon>
    </button>

    <p><mat-slide-toggle class="search-options-toggle"
        (change)="searchOption(searchLocallySliderNextValue())">@if(searchLocallySliderNextValue()){
        My Homes }@else{Globally}</mat-slide-toggle></p>
  </div>

  <div class="notification">
    <app-notification-bell></app-notification-bell>
  </div>

  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/account-settings">
      <mat-icon>settings</mat-icon>
      <span>Account Settings</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
