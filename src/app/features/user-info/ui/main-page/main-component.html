<header class="main-header">
  <app-main-navbar-component [userName]="userName" [imageSource]="userImage" (searchHomes)="searchForHomes($event)"
    (searchLocally)="searchLocally($event)">
  </app-main-navbar-component>
</header>

<main class="main-body">
  <section class="homes-grid" #mainContainer>
    @for (home of displaySource; track $index)
    {
    <app-home-card-component [home]=" home" [userIn]="isUserIn(home )" [isOwner]="isOwner(home)">
    </app-home-card-component>
    }
    <app-home-card-component></app-home-card-component>
  </section>
</main>

<footer class="main-footer">
  <div class="pagination">
    <mat-paginator #paginator class="main-paginator" (page)="handlePageEvent($event)" [length]="length"
      [pageSize]="pageSize" [disabled]="disabled" [showFirstLastButtons]="showFirstLastButtons"
      [pageSizeOptions]="showPageSizeOptions ? pageSizeOptions : []" [hidePageSize]="false" [pageIndex]="pageIndex"
      aria-label="Select page">
    </mat-paginator>
  </div>
</footer>
