<div class="home-card" (click)="homeExists ? gotoHome() : NewHome()">
  <div class="home-card__bg" aria-hidden="true"></div>

  <div class="home-card__content">

    @if(isOwner){
    <mat-icon class="home-card__owner">stars</mat-icon>
    }
    @else if(userIn){
    <mat-icon class="home-card__userin">home</mat-icon>
    }
    <div class="home-card__title">{{homeName}}</div>
    @if(homeExists){
    <div class="home-card__sub">{{home.homeInfo}}</div>
    <div class="home-card__sub">{{home.address}}</div>
    }@else{
    <div class="home-card__sub">Tap to Create New Home</div>
    }
  </div>

  <mat-icon class="home-card__arrow">chevron_right</mat-icon>
</div>
