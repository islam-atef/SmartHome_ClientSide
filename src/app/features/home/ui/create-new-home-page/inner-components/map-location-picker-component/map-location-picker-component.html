<div class="picker">
  <div class="picker__header">
    <h3>Select Location</h3>
    <p>Click on the map to drop a pin, then confirm.</p>
    <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
  </div>

  <div class="map-wrap">
    <div id="map" class="map"></div>

    <div class="info">
      <div><b>Lat:</b> {{ lat }}</div>
      <div><b>Lng:</b> {{ lng }}</div>
    </div>
  </div>

  <div class="picker__footer">
    @if(markerPosition){
    <div class="picker__coords">
      <div><b>Lat:</b> {{ markerPosition.lat }}</div>
      <div><b>Lng:</b> {{ markerPosition.lng }}</div>
    </div>
    }@else {
    <div class="picker__coords muted">No location selected yet.</div>
    }

    <div class="picker__actions">
      <button mat-stroked-button type="button" (click)="resetPin()">Reset</button>
      <button mat-raised-button color="primary" type="button" [disabled]="!markerPosition" (click)="confirm()">
        Confirm Location
      </button>
    </div>
  </div>
</div>
